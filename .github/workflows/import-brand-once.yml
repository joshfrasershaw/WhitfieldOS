name: Import Whitfield brand assets once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download supplied company images
        run: |
          mkdir -p public/brand
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 40 --silent --show-error \
            'https://www.whitfieldplumbing.co.uk/wp-content/uploads/2023/01/plumbing-heating-shrewsbury.png' \
            --output public/brand/whitfield-logo.png
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 40 --silent --show-error \
            'https://www.whitfieldplumbing.co.uk/wp-content/uploads/2024/03/whitfield-van-2024-illustration-v02-250px.jpg' \
            --output public/brand/whitfield-van.jpg
          file public/brand/*
          test "$(head -c 4 public/brand/whitfield-logo.png | od -An -tx1 | tr -d ' \n')" = "89504e47"
          test "$(head -c 3 public/brand/whitfield-van.jpg | od -An -tx1 | tr -d ' \n')" = "ffd8ff"
          test "$(wc -c <public/brand/whitfield-logo.png)" -gt 1000
          test "$(wc -c <public/brand/whitfield-van.jpg)" -gt 1000
      - name: Commit supplied assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/
          if ! git diff --cached --quiet; then
            git commit -m "assets: add official Whitfield logo and van image"
            git push origin HEAD:main
          fi
